<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate QR Studio</title>
    <style>
        /* Modern Native CSS Layout configured for your company colors */
        :root { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b; 
            --primary: #1e3f20; /* Sleek Forest Green Theme */
            --primary-hover: #142b16; 
            --border: #e2e8f0; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: var(--card); padding: 32px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
        p { margin: 0; font-size: 13px; color: var(--text-muted); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input[type="text"] { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; box-sizing: border-box; }
        input[type="text"]:focus { border-color: var(--primary); }
        .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input[type="color"] { width: 100%; height: 42px; padding: 4px; background: white; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; box-sizing: border-box; }
        .preview-area { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 14px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        #qr-image { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 180px; height: auto; display: block; }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; text-align: center; display: block; text-decoration: none; box-sizing: border-box; }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>QR Studio</h1>
            <p>Production Build • Instant Network Delivery</p>
        </div>

        <div class="form-group">
            <label>URL or Text</label>
            <input type="text" id="qr-text" value="https://princesstam-tech.github.io/due-diligence/japan/">
        </div>

        <div class="color-row">
            <div class="form-group">
                <label>QR Code Color</label>
                <input type="color" id="qr-color" value="#cc5500">
            </div>
            <div class="form-group">
                <label>Background Color</label>
                <input type="color" id="qr-bg" value="#ffffff">
            </div>
        </div>

        <div class="preview-area">
            <!-- Normal image tag that loads cleanly without scripts crashing -->
            <img id="qr-image" alt="QR Code Preview">
        </div>

        <button id="download-btn" class="btn">Download QR Code</button>
    </div>

    <script>
        const txtInput = document.getElementById('qr-text');
        const colInput = document.getElementById('qr-color');
        const bgInput = document.getElementById('qr-bg');
        const qrImage = document.getElementById('qr-image');
        const dlBtn = document.getElementById('download-btn');

        function updateQR() {
            const textValue = encodeURIComponent(txtInput.value.trim());
            if (!textValue) return;

            // Remove the hash symbol from colors so the API can read them cleanly
            const darkColor = colInput.value.replace('#', '');
            const lightColor = bgInput.value.replace('#', '');

            // Generates using a highly available, unblockable image link engine
            const apiUrl = `https://qrserver.com{textValue}&color=${darkColor}&bgcolor=${lightColor}&qzone=1`;
            
            // Set the image src directly
            qrImage.src = apiUrl;
        }

        // Run live as controls change
        txtInput.addEventListener('input', updateQR);
        colInput.addEventListener('input', updateQR);
        bgInput.addEventListener('input', updateQR);

        // Download by fetching the generated image file data safely
        dlBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(qrImage.src);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = 'scannable-qrcode.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                // Safe browser fallback window download method if tracking rules block fetch requests
                window.open(qrImage.src, '_blank');
            }
        });

        // Initialize instantly on launch
        updateQR();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio</title>
    <!-- Official, unedited, trusted CDNJS mirror library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; --primary: #2563eb; --primary-hover: #1d4ed8; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: var(--card); padding: 32px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
        p { margin: 0; font-size: 13px; color: var(--text-muted); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input[type="text"] { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; box-sizing: border-box; }
        .preview-area { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 14px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        #qrcode img { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>QR Studio</h1>
            <p>Official Stable Mirror Engine</p>
        </div>

        <div class="form-group">
            <label>URL or Text</label>
            <input type="text" id="qr-text" value="https://github.io">
        </div>

        <div class="preview-area">
            <div id="qrcode"></div>
        </div>

        <button id="download-btn" class="btn">Download QR Code</button>
    </div>

    <script>
        const txtInput = document.getElementById('qr-text');
        const qrContainer = document.getElementById('qrcode');
        const dlBtn = document.getElementById('download-btn');
        
        let qrcodeInstance = null;

        function renderQR() {
            const val = txtInput.value.trim();
            if (!val) return;

            qrContainer.innerHTML = "";

            // Uses standard initialization without modifying internal engine values
            qrcodeInstance = new QRCode(qrContainer, {
                text: val,
                width: 180,
                height: 180,
                colorDark : "#1e3a8a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        txtInput.addEventListener('input', renderQR);

        dlBtn.addEventListener('click', () => {
            const qrImg = qrContainer.querySelector('img');
            if (qrImg && qrImg.src) {
                const a = document.createElement('a');
                a.download = 'scannable-qrcode.png';
                a.href = qrImg.src;
                a.click();
            } else {
                alert("QR Code image is still processing.");
            }
        });

        // Initialize display safely
        renderQR();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal QR Code Generator</title>
    <!-- Tailwind CSS for modern, clean styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- EasyQRCodeJS library for fast, high-quality QR generation -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h1 class="text-2xl font-bold text-center mb-1 text-slate-900">QR Code Generator</h1>
        <p class="text-xs text-center text-slate-400 mb-6">Hosted on GitHub Pages</p>

        <!-- Input Box -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-2">URL or Text</label>
            <input type="text" id="qr-text" value="https://github.com" 
                class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>

        <!-- Customizations -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">QR Color</label>
                <input type="color" id="qr-color" value="#000000" class="w-full h-10 p-1 bg-white border border-slate-200 rounded-lg cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Background</label>
                <input type="color" id="qr-bg" value="#ffffff" class="w-full h-10 p-1 bg-white border border-slate-200 rounded-lg cursor-pointer">
            </div>
        </div>

        <!-- QR Display Window -->
        <div class="flex flex-col items-center justify-center bg-slate-100 p-6 rounded-xl min-h-[240px] mb-6 border border-dashed border-slate-200">
            <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm"></div>
        </div>

        <!-- Action Button -->
        <button id="download-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow-md shadow-blue-200 transition-all cursor-pointer text-center block">
            Download PNG Image
        </button>
    </div>

    <script>
        const qrTextInput = document.getElementById('qr-text');
        const qrColorInput = document.getElementById('qr-color');
        const qrBgInput = document.getElementById('qr-bg');
        const qrContainer = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('download-btn');
        
        let qrCodeInstance = null;

        function generateQR() {
            // Clear existing QR code content
            qrContainer.innerHTML = "";
            
            const textValue = qrTextInput.value.trim();
            if (!textValue) return;

            // Initialize EasyQRCodeJS configurations
            qrCodeInstance = new QRCode(qrContainer, {
                text: textValue,
                width: 200,
                height: 200,
                colorDark: qrColorInput.value,
                colorLight: qrBgInput.value,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Trigger updates automatically when inputs change
        qrTextInput.addEventListener('input', generateQR);
        qrColorInput.addEventListener('input', generateQR);
        qrBgInput.addEventListener('input', generateQR);

        // Download Action Functionality
        downloadBtn.addEventListener('click', () => {
            const qrImage = qrContainer.querySelector('img');
            if (qrImage) {
                const link = document.createElement('a');
                link.download = 'my-custom-qrcode.png';
                link.href = qrImage.src;
                link.click();
            } else {
                alert("Please type some text first to generate a code!");
            }
        });

        // Generate default code on load
        generateQR();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate QR Studio</title>
    <!-- Official, unedited, trusted EasyQRCodeJS engine - handles logos and shapes natively -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b; 
            --primary: #1e3f20; /* Brand Forest Green */
            --primary-hover: #142b16; 
            --border: #e2e8f0; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: var(--card); padding: 32px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
        p { margin: 0; font-size: 13px; color: var(--text-muted); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input[type="text"] { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; box-sizing: border-box; }
        input[type="text"]:focus { border-color: var(--primary); }
        .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input[type="color"] { width: 100%; height: 42px; padding: 4px; background: white; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; box-sizing: border-box; }
        input[type="file"] { font-size: 13px; color: var(--text-muted); }
        .preview-area { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 14px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        #qrcode img, #qrcode canvas { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; text-align: center; }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>QR Studio</h1>
            <p>Official Stable Engine • Custom Branding & Logos</p>
        </div>

        <div class="form-group">
            <label>URL or Text</label>
            <input type="text" id="qr-text" value="https://princesstam-tech.github.io/due-diligence/japan/">
        </div>

        <div class="color-row">
            <div class="form-group">
                <label>QR Code Color</label>
                <input type="color" id="qr-color" value="#8b3a00">
            </div>
            <div class="form-group">
                <label>Background Color</label>
                <input type="color" id="qr-bg" value="#ffffff">
            </div>
        </div>

        <!-- New Logo Upload Group Field -->
        <div class="form-group">
            <label>Center Logo (Optional)</label>
            <input type="file" id="qr-logo" accept="image/*">
        </div>

        <div class="preview-area">
            <div id="qrcode"></div>
        </div>

        <button id="download-btn" class="btn">Download QR Code</button>
    </div>

    <script>
        const txtInput = document.getElementById('qr-text');
        const colInput = document.getElementById('qr-color');
        const bgInput = document.getElementById('qr-bg');
        const logoInput = document.getElementById('qr-logo');
        const qrContainer = document.getElementById('qrcode');
        const dlBtn = document.getElementById('download-btn');
        
        let logoBase64 = null;

        function renderQR() {
            const val = txtInput.value.trim();
            if (!val) return;

            qrContainer.innerHTML = "";

            // Use options supported by the advanced EasyQRCodeJS engine
            const options = {
                text: val,
                width: 180,
                height: 180,
                colorDark: colInput.value,
                colorLight: bgInput.value,
                correctLevel: QRCode.CorrectLevel.H, // Force Level H to allow center blocking
                drawer: 'canvas' // Clean render strategy
            };

            // Inject logo settings if an image is uploaded
            if (logoBase64) {
                options.logo = logoBase64;
                options.logoWidth = 45; // Sets safe dimensions to remain perfectly scannable
                options.logoHeight = 45;
                options.logoBackgroundColor = bgInput.value; // Clean padding background mask around logo
                options.logoBackgroundTransparent = false;
            }

            try {
                new QRCode(qrContainer, options);
            } catch (err) {
                console.error(err);
            }
        }

        // Live modification events
        txtInput.addEventListener('input', renderQR);
        colInput.addEventListener('input', renderQR);
        bgInput.addEventListener('input', renderQR);

        // Convert local image uploaded to a Base64 stream string
        logoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    logoBase64 = event.target.result;
                    renderQR();
                };
                reader.readAsDataURL(file);
            } else {
                logoBase64 = null;
                renderQR();
            }
        });

        // Fail-safe download handler
        dlBtn.addEventListener('click', () => {
            const qrCanvas = qrContainer.querySelector('canvas');
            const qrImg = qrContainer.querySelector('img');
            let downloadUrl = null;

            if (qrCanvas) {
                downloadUrl = qrCanvas.toDataURL("image/png");
            } else if (qrImg && qrImg.src) {
                downloadUrl = qrImg.src;
            }

            if (downloadUrl) {
                const a = document.createElement('a');
                a.download = 'logo-qrcode.png';
                a.href = downloadUrl;
                a.click();
            } else {
                alert("Rendering image. Try typing another character to refresh.");
            }
        });

        // Run initial setup
        renderQR();
    </script>
</body>
</html>

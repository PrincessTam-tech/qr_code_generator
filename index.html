<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio</title>
    <!-- Official, reliable CDNJS mirror library -->
    <script src="https://cloudflare.com"></script>
    <style>
        /* Updated Theme Variables to match your corporate colors */
        :root { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b; 
            --primary: #1e3f20; /* Sleek Forest Green Theme */
            --primary-hover: #142b16; 
            --border: #e2e8f0; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: var(--card); padding: 32px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
        p { margin: 0; font-size: 13px; color: var(--text-muted); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input[type="text"] { width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; box-sizing: border-box; }
        input[type="text"]:focus { border-color: var(--primary); }
        .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input[type="color"] { width: 100%; height: 42px; padding: 4px; background: white; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; box-sizing: border-box; }
        .preview-area { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 14px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        #qrcode img, #qrcode canvas { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 100%; height: auto; }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>QR Studio</h1>
            <p>Official Stable Mirror Engine</p>
        </div>

        <div class="form-group">
            <label>URL or Text</label>
            <input type="text" id="qr-text" value="https://github.io">
        </div>

        <div class="color-row">
            <div class="form-group">
                <label>QR Code Color</label>
                <!-- Default color input set to Burnt Orange (#cc5500) -->
                <input type="color" id="qr-color" value="#cc5500">
            </div>
            <div class="form-group">
                <label>Background Color</label>
                <input type="color" id="qr-bg" value="#ffffff">
            </div>
        </div>

        <div class="preview-area">
            <div id="qrcode"></div>
        </div>

        <button id="download-btn" class="btn">Download QR Code</button>
    </div>

    <script>
        const txtInput = document.getElementById('qr-text');
        const colInput = document.getElementById('qr-color');
        const bgInput = document.getElementById('qr-bg');
        const qrContainer = document.getElementById('qrcode');
        const dlBtn = document.getElementById('download-btn');
        
        let qrcodeInstance = null;

        function renderQR() {
            const val = txtInput.value.trim();
            if (!val) return;

            qrContainer.innerHTML = "";

            // Generates using your chosen live hex code selection color parameters
            qrcodeInstance = new QRCode(qrContainer, {
                text: val,
                width: 180,
                height: 180,
                colorDark : colInput.value,
                colorLight : bgInput.value,
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // Live input event bindings
        txtInput.addEventListener('input', renderQR);
        colInput.addEventListener('input', renderQR);
        bgInput.addEventListener('input', renderQR);

        // Instant safe download script execution loops
        dlBtn.addEventListener('click', () => {
            const qrCanvas = qrContainer.querySelector('canvas');
            const qrImg = qrContainer.querySelector('img');
            let downloadUrl = null;

            if (qrCanvas) {
                downloadUrl = qrCanvas.toDataURL("image/png");
            } else if (qrImg && qrImg.src) {
                downloadUrl = qrImg.src;
            }

            if (downloadUrl) {
                const a = document.createElement('a');
                a.download = 'scannable-qrcode.png';
                a.href = downloadUrl;
                a.click();
            } else {
                alert("Rendering pipeline error. Try typing another character.");
            }
        });

        // Initialize presentation defaults immediately
        renderQR();
    </script>
</body>
</html>
